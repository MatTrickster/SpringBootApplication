spring.application.name=SpringBoot

# ---- Server ----
# Bind to loopback only. Spring Boot's default is all interfaces, which would
# expose this unauthenticated app (and the dev H2 console) to your whole network.
server.address=127.0.0.1

# ---- Profiles ----
# Used only when no profile is activated (e.g. via --spring.profiles.active=qa
# or SPRING_PROFILES_ACTIVE=qa). Profile files override values below.
spring.profiles.default=dev

# ---- App defaults (overridden per profile) ----
app.environment-name=default
app.feature-x-enabled=false
app.max-page-size=20
app.support-email=support@example.com
# Username returned by GET /users/default. staging doesn't override it, so it inherits this.
app.default-user=alice
# app.trade-events.enabled is deliberately NOT set here: @ConditionalOnProperty(matchIfMissing = true)
# then picks the no-op publisher. dev turns it on.

# ---- Datasource: in-memory H2 ----
# No URL here, so Boot generates a unique in-memory DB per application context. That keeps
# qa/staging test contexts from sharing (and dropping) the dev DB. dev pins a fixed name.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---- Data initialization ----
# data.sql runs for embedded DBs by default. Hibernate creates the tables, so defer
# data.sql until AFTER Hibernate's DDL, or the INSERTs fail with "table not found".
spring.jpa.defer-datasource-initialization=true

# ---- Logging ----
logging.level.root=INFO
