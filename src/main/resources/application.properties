spring.application.name=SpringBoot

# ---- Server ----
# Bind to loopback only. Spring Boot's default is all interfaces, which would
# expose this unauthenticated app (and the dev H2 console) to your whole network.
server.address=127.0.0.1

# ---- Profiles ----
# Used only when no profile is activated (e.g. via --spring.profiles.active=qa
# or SPRING_PROFILES_ACTIVE=qa). Profile files override values below.
spring.profiles.default=dev

# ---- App defaults (overridden per profile) ----
app.environment-name=default
app.feature-x-enabled=false
app.max-page-size=20
app.support-email=support@example.com

# ---- Datasource: in-memory H2 (same style HackerRank projects use) ----
spring.datasource.url=jdbc:h2:mem:tradesdb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---- Logging ----
logging.level.root=INFO
