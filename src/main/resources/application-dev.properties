app.environment-name=development
app.feature-x-enabled=true
app.default-user=admin
app.trade-events.enabled=true

# Fixed DB name so the H2 console (http://localhost:8080/h2-console) can connect with
# JDBC URL jdbc:h2:mem:tradesdb, user "sa", empty password.
spring.datasource.url=jdbc:h2:mem:tradesdb

# Dev conveniences
spring.jpa.show-sql=true
spring.h2.console.enabled=true
logging.level.com.example.springboot=DEBUG
